plugins {
    id "dev.architectury.loom"
    id "com.gradleup.shadow"
}

def generatedResources = file("src/generated/resources")
def existingResources = file("src/main/resources")

architectury {
    platformSetupLoomIde()
}

loom {
    silentMojangMappingsLicense()

    runs {
        client {
            getSystemProperties().put("neoforge.enabledGameTestNamespaces", rootProject.mod_id)
        }

        server {
            getSystemProperties().put("neoforge.enabledGameTestNamespaces", rootProject.mod_id)
        }

        data {
            data()
            programArgs "--mod", rootProject.mod_id, "--all",
                    "--output", generatedResources.absolutePath,
                    "--existing", existingResources.absolutePath
        }

        configureEach {
            getSystemProperties().put("forge.logging.markers", "REGISTRIES")
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet "main"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
    }

    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"

    compileOnly "curse.maven:sophisticated-core-618298:8627791"
    compileOnly "curse.maven:sophisticated-backpacks-422301:8627841"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

base {
    archivesName = "${rootProject.mod_id}-neoforge"
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def resourceProperties = [version: project.version.toString()]

processResources {
    inputs.property "version", resourceProperties.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand resourceProperties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
