plugins {
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "dev.architectury.loom" version "${arch_loom_version}" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    apply plugin: "architectury-plugin"

    group = project.mod_group_id
    version = project.mod_version

    repositories {
        mavenCentral()
        maven {
            name = "Mojang"
            url = "https://libraries.minecraft.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Parchment"
            url = "https://maven.parchmentmc.org"
        }
        maven {
            name = "CurseMaven"
            url = "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }
}

subprojects {
    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.withType(net.fabricmc.loom.task.RemapJarTask).configureEach {
        notCompatibleWithConfigurationCache("Loom RemapJarTask captures the project instance")
    }

    tasks.withType(dev.architectury.plugin.PrepareArchitecturyTransformer).configureEach {
        notCompatibleWithConfigurationCache("Architectury transformer task captures the project instance")
    }

    tasks.withType(dev.architectury.plugin.TransformingTask).configureEach {
        notCompatibleWithConfigurationCache("Architectury transforming task captures the project instance")
    }
}
